; ============================================================================
; Airlock Controller — example Custom Data
; Paste into the Programmable Block's Custom Data and tune in-game.
; (If left empty, the script writes the [Airlocks] section automatically.)
;
; Re-read every RefreshInterval seconds, so edits take effect without a
; recompile — handy when tuning the pressure thresholds against a real chamber.
; ============================================================================
[Airlocks]

; Block groups whose name starts with this are treated as airlocks. Each group
; holds that airlock's air vent(s), its doors, and optionally an LCD.
; The airlock's display name is the group name with this prefix removed, so
; "Airlock Hangar" shows and is commanded as "Hangar".
GroupPrefix=Airlock

; Substrings identifying which side each door is on, matched case-insensitively
; against the door's own name. A door matching both, or neither, is reported as
; an error rather than guessed at.
InteriorKeyword=Interior
ExteriorKeyword=Exterior

; Seconds a door stays at full open before it is closed again. The delay is
; measured from FULL OPEN, not from the start of travel, so 1 second really is
; a second of walking time.
CloseDelay=1

; Oxygen level at/above which the interior side is usable.
; Lower this if a door opening briefly dips the chamber below the threshold and
; makes the airlock re-cycle when it should just stay put.
PressurizedLevel=0.9

; Oxygen level at/below which the exterior side is usable.
; Must be below PressurizedLevel — if it is not, both values reset to defaults
; and a warning appears on the script's screen.
DepressurizedLevel=0.05

; Seconds without oxygen progress before a cycle is declared stalled. On a
; stall the script unlocks the side the cycle was heading toward and leaves the
; vent still trying, so opening that door finishes the job.
StallTimeout=10

; How much the oxygen level must move toward the target to count as progress.
; Progress accumulates across ticks, so a slow chamber is not mistaken for a
; stalled one. Raise it only if a genuinely stuck chamber is not being caught.
StallEpsilon=0.01

; Seconds between re-scans of the grid for airlock groups. Adding, renaming or
; removing an airlock takes effect within this interval.
RefreshInterval=30

; Ignore blocks on grids docked by connector. Leave true so a docked ship
; carrying its own airlock group is not managed by this base's script.
SameConstructOnly=true

; Optional LCD name for the all-airlock summary, the same text the script shows
; on its own screen. Leave blank for none. Per-airlock screens need no config:
; drop an LCD into an airlock's group and it shows that chamber's oxygen level.
StatusPanel=
