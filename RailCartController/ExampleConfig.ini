; ============================================================================
; Rail Cart Controller — example Custom Data
; Paste into the Programmable Block's Custom Data and tune in-game.
; (If left empty, the script writes the [CartController] section automatically.)
; ============================================================================
[CartController]
; Target travel speed (m/s).
CruiseSpeed=10
; Emergency-brake threshold on total speed (m/s). Must be > CruiseSpeed.
MaxSpeed=15
; Proportional gain: propulsion override per m/s of error. Higher = more aggressive.
Kp=0.35
; m/s above target before the wheel brakes engage (below this, gentle engine braking).
BrakeOverspeed=2
; Global flip. Set -1 if the WHOLE cart emergency-brakes immediately or drives
; the wrong way when you send 'start'.
PropulsionSign=1
; Plain-cruise travel direction (true/false). Not used by 'goto' (which picks
; direction automatically toward the target stop).
Reverse=false
; Two block groups of drive wheels, both driven at +override. (Wheels used to
; need opposite signs by side; a Space Engineers update fixed that, so the two
; groups are now just a convenient split.) Do NOT include alignment/guide
; wheels. (If the whole cart runs backward, use PropulsionSign=-1.)
LeftWheelGroup=Drive Left
RightWheelGroup=Drive Right
; Minimum approach speed near a stop (m/s).
CrawlSpeed=1
; Deceleration used to plan the approach slowdown (m/s^2). Lower = slows earlier.
ApproachDecel=1.5
; Distance to the stop at which to crawl and connect (m).
ConnectDistance=2.5

; ----------------------------------------------------------------------------
; Stops are captured in-game: dock the cart, then run  setstop <name>
; The script fills in this section. You can also hand-edit it. Each stop is:
;   <Name>          = <connector block name that docks at this stop>
;   <Name>.X/.Y/.Z  = world coordinates recorded at capture
; Example (filled by 'setstop Base' while docked with "Front Connector"):
; ----------------------------------------------------------------------------
; [Stops]
; Base=Front Connector
; Base.X=12345.67
; Base.Y=-2345.12
; Base.Z=8901.44
