; ============================================================================
; Track Shuttle Controller — example Custom Data
; Paste into the Programmable Block's Custom Data and tune in-game.
; (If left empty, the script writes this template automatically on first run.)
; ============================================================================
[ShuttleController]
; Target travel speed (m/s).
CruiseSpeed=10
; Emergency-brake threshold on total speed (m/s). Must be > CruiseSpeed.
MaxSpeed=15
; Proportional gain: propulsion override per m/s of error. Higher = more aggressive.
Kp=0.35
; m/s above cruise before the wheel brakes engage (below this, gentle engine braking).
BrakeOverspeed=2
; Global wiring flip. Set -1 if the cart emergency-brakes immediately or drives
; the wrong way when you send 'start'.
PropulsionSign=1
; Flip travel direction along the track (true/false). Use this if the cart drives
; smoothly but toward the wrong end of the track.
Reverse=false
; Block group containing ONLY the drive wheels (the 8 left/right wheels).
; Do NOT include alignment/guide wheels. Left vs right is detected automatically.
DriveWheelGroup=Drive Wheels
